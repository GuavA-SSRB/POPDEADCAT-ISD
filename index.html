<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POPDEADCAT</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-width: 320px; /* 確保不會小於手機常見寬度 */
        }

        .cat-container {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            text-align: center;
            font-family: "Nunito", cursive;
            color: #000000;
        }

        .content .title {
            font-size: 60px;
            letter-spacing: 10px;
            margin: 0 0 20px 0;
        }

        .content .times {
            font-size: 40px;
        }

        .content .image {
            width: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image img {
            width: 300%;
            margin-left: 100px; /* 調整img位置 */
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="cat-container">
        <div class="content">
            <div class="col-12">
                <h1 class="title">POPDEADCAT</h1>
                <span class="times">0</span>
            </div>
            <div class="col-md-6 col-12">
                <div class="image">
                    <img src="img/segu1.png" alt="segucat">
                </div>
            </div>
            <audio src="https://www.myinstants.com/media/sounds/pop-cat-original-meme_3ObdYkj.mp3" class="pop"></audio>
        </div>
    </div>

    <script>
        // 選取出會使用到的圖片容器、累計數字及音訊節點
        const image = document.querySelector(".image");
        const times = document.querySelector(".times");
        const audio = document.querySelector(".pop");

        // 當圖片容器監聽到觸發點擊事件
        image.addEventListener("click", (event) => {
            const target = event.target;
            let countTimes = Number(times.textContent);
            // 確保是貓貓圖片被點擊後才會開始進行
            if (target.alt === "segucat") {
                    countTimes++;
                    target.src = "img/segu2.png";
                audio.currentTime = 0;
                audio.play();
                setTimeout(() => {
                    target.src = "img/segu1.png";
                }, 100);
        }
            times.textContent = countTimes;
        });
    </script>
</body>
</html>
