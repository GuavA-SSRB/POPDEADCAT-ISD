<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>POPDEADCAT</title>
    <link rel="icon" href="img/favicon.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        .cat-container {
            text-align: center;
            margin-top: 50px;
        }
        .cat-img {
            cursor: pointer;
            max-width: 300px;
            transition: transform 0.2s;
        }
        .cat-img:active {
            transform: scale(1.1);
        }
    </style>
</head>
<body class="bg-light">
    <div class="container text-center">
        <h1 class="my-4">POPDEADCAT</h1>
        <div class="cat-container">
            <img id="catImage" src="img/close_mouth.jpg" alt="可愛小貓寶" class="cat-img">
        </div>
        <p class="mt-3">CLICK TO POP!</p>
    </div>

    <script>
        $(document).ready(function(){
            let catImages = ["img/close_mouth.jpg", "img/open_mouth.jpg"];
            let index = 0;
            
            $("#catImage").click(function(){
                index = (index + 1) % catImages.length;
                $(this).attr("src", catImages[index]);
            });
        });
    </script>
</body>
</html>
